services:
  app:
    build:
      context: ./build
    environment:
      CUPS_ADMIN_PASSWORD_FILE: /run/secrets/cups_admin_password
    secrets:
      - cups_admin_password
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/dbus:/var/run/dbus:ro
      - './data/backups:/backups'
      - cups_data:/etc/cups
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    healthcheck:
      test: [CMD, lpstat, -r]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    network_mode: host
    restart: unless-stopped

volumes:
  cups_data:

secrets:
  cups_admin_password:
    environment: CUPS_ADMIN_PASSWORD
